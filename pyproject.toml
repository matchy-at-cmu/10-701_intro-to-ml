[project]
name = "10-701-intro-to-ml"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP035"]
