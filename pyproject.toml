[project]
name = "10-701-intro-to-ml"
version = "0.1.0"
requires-python = "==3.9.*"
dependencies = [
    "antlr4-python3-runtime==4.11.*",
    "jupyter>=1.1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pymupdf>=1.24",
    "pytest>=8",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP035"]

[tool.pytest.ini_options]
pythonpath = ["."]
